name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Command-line smoke test
        shell: bash
        run: |
          adsorption-benchmark --version
          adsorption-benchmark table
          adsorption-benchmark eigen -n 5 --alpha 0.3 --gamma 5 --K 10 --Da 25
          adsorption-benchmark uptake --n 10 --out ci_uptake.csv
          python -m adsorption_benchmark profile --tau 1 --nodes 5
